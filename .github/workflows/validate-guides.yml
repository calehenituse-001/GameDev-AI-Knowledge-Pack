name: Validate GameDev Guides

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/validate-guides.yml'
      - 'tools/validate_guides.py'
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/validate-guides.yml'
      - 'tools/validate_guides.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Markdown and skill format
        run: python3 tools/validate_guides.py
